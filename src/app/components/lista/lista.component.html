<div class="container mt-4">
  <h2>Lista de Tickets</h2>

  @if (tickets && tickets.length > 0) {
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (item of tickets; track item.id || $index) {
            <tr>
              <td>{{ item.id }}</td>
              <td>{{ item.titulo }}</td>
              <td>{{ item.descripcion }}</td>
              <td>
                <span class="badge" [ngClass]="{
                  'bg-warning': item.estado === 'PENDIENTE',
                  'bg-info': item.estado === 'EN_PROCESO',
                  'bg-success': item.estado === 'RESUELTO'
                }">
                  {{ item.estado }}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-danger" (click)="eliminarTicket(item.id)">
                  Eliminar
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <div class="alert alert-info">
      No hay tickets registrados actualmente.
    </div>
  }
</div>
